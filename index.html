<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FRUITPOP</title>

    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.0/dist/aframe-extras.min.js"></script>
  </head>

  <body style="margin: 0; overflow: hidden">
    <a-scene
      embedded
      vr-mode-ui="enabled: false"
      renderer="logarithmicDepthBuffer: true;"
      arjs="sourceType: webcam; debugUIEnabled: false;"
    >
      <a-entity light="type: ambient; intensity: 1"></a-entity>
      <a-entity
        light="type: directional; intensity: 0.6"
        position="1 1 0"
      ></a-entity>

      <!-- Asset -->
      <a-assets>
        <a-asset-item id="apel" src="model/Apel.glb"></a-asset-item>
        <audio id="apelaudio" src="audio/Apel.wav"></audio>
      </a-assets>

      <!-- Marker Apel -->
      <a-marker
        id="marker-apel"
        class="fruit-marker"
        type="pattern"
        url="marker/Apel.patt"
      >
        <a-entity
          id="apel-entity"
          gltf-model="#apel"
          position="0 0 0"
          rotation="30 180 0"
          scale="5 5 5"
          animation-mixer
          sound="src: #apelaudio; autoplay: false; loop: false"
        ></a-entity>
      </a-marker>

      <!-- Kamera -->
      <a-entity camera></a-entity>
    </a-scene>

    <!-- Audio Buah -->
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const markerApel = document.querySelector("#marker-apel");
        const apelEntity = document.querySelector("#apel-entity");

        if (markerApel && apelEntity) {
          markerApel.addEventListener("markerFound", () => {
            apelEntity.components.sound.playSound();
          });

          markerApel.addEventListener("markerLost", () => {
            apelEntity.components.sound.stopSound();
          });
        }
      });
    </script>
  </body>
</html>
