<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FRUITPOP</title>

    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.0/dist/aframe-extras.min.js"></script>
    <style>
      /* Button Mulai */
      #btn-mulai {
        position: absolute;
        z-index: 9999;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 16px 32px;
        font-size: 20px;
        font-weight: bold;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        background: rgb(255, 0, 123);
        color: white;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      #btn-mulai:hover {
        transform: translate(-50%, -50%) scale(1.08);
        box-shadow: 0 6px 16px rgba(255, 0, 123, 0.6);
      }

      #btn-mulai:active {
        transform: translate(-50%, -50%) scale(0.92);
        box-shadow: 0 3px 8px rgba(0, 0, 0, 0.3);
      }
    </style>
  </head>

  <body style="margin: 0; overflow: hidden">
    <button id="btn-mulai">MULAI</button>

    <a-scene
      embedded
      vr-mode-ui="enabled: false"
      renderer="logarithmicDepthBuffer: true;"
      arjs="sourceType: webcam; debugUIEnabled: false;"
    >
      <a-entity light="type: ambient; intensity: 1"></a-entity>
      <a-entity
        light="type: directional; intensity: 0.6"
        position="1 1 0"
      ></a-entity>

      <!-- Asset -->
      <a-assets>
        <audio id="welcome-audio" src="audio/Selamat Datang.wav"></audio>

        <a-asset-item id="apel" src="model/apel.glb"></a-asset-item>
        <audio id="apelaudio" src="audio/Apel.wav"></audio>

        <a-asset-item id="alpukat" src="model/alpukat.glb"></a-asset-item>
        <audio id="alpukataudio" src="audio/Alpukat.wav"></audio>

        <a-asset-item id="pisang" src="model/pisang.glb"></a-asset-item>
        <audio id="pisangaudio" src="audio/Pisang.wav"></audio>

        <a-asset-item id="labu" src="model/labu.glb"></a-asset-item>
        <audio id="labuaudio" src="audio/Labu.wav"></audio>

        <a-asset-item id="ceri" src="model/ceri.glb"></a-asset-item>
        <audio id="ceriaudio" src="audio/Ceri.wav"></audio>

        <a-asset-item id="jeruk" src="model/jeruk.glb"></a-asset-item>
        <audio id="jerukaudio" src="audio/Jeruk.wav"></audio>

        <a-asset-item id="nanas" src="model/nanas.glb"></a-asset-item>
        <audio id="nanasaudio" src="audio/Nanas.wav"></audio>

        <a-asset-item id="tomat" src="model/tomat.glb"></a-asset-item>
        <audio id="tomataudio" src="audio/Tomat.wav"></audio>

        <a-asset-item id="semangka" src="model/semangka.glb"></a-asset-item>
        <audio id="semangkaaudio" src="audio/Semangka.wav"></audio>

        <a-asset-item id="anggur" src="model/anggur2.glb"></a-asset-item>
        <audio id="angguraudio" src="audio/Anggur.wav"></audio>

      </a-assets>

      <!-- Marker Apel -->
      <a-marker
        id="marker-apel"
        class="fruit-marker"
        type="pattern"
        url="marker/Apel.patt"
      >
        <a-entity
          id="apel-entity"
          gltf-model="#apel"
          position="0 0 0"
          rotation="30 180 0"
          scale="11 11 11"
          animation-mixer
          sound="src: #apelaudio; autoplay: false; loop: false"
        ></a-entity>
      </a-marker>

      <!-- Marker Alpukat -->
      <a-marker
        id="marker-alpukat"
        class="fruit-marker"
        type="pattern"
        url="marker/Alpukat.patt"
      >
        <a-entity
          id="alpukat-entity"
          gltf-model="#alpukat"
          position="0 0 0"
          rotation="30 180 0"
          scale="12 12 12"
          animation-mixer
          sound="src: #alpukataudio; autoplay: false; loop: false"
        ></a-entity>
      </a-marker>

      <!-- Marker Pisang -->
      <a-marker
        id="marker-pisang"
        class="fruit-marker"
        type="pattern"
        url="marker/pisang2.patt"
      >
        <a-entity
          id="pisang-entity"
          gltf-model="#pisang"
          position="0 0 0"
          rotation="30 180 0"
          scale="0.2 0.2 0.2"
          animation-mixer
          sound="src: #pisangaudio; autoplay: false; loop: false"
        ></a-entity>
      </a-marker>

      <!-- Marker Labu -->
      <a-marker
        id="marker-labu"
        class="fruit-marker"
        type="pattern"
        url="marker/labu2.patt"
      >
        <a-entity
          id="labu-entity"
          gltf-model="#labu"
          position="0 0 0"
          rotation="30 180 0"
          scale="5 5 5"
          animation-mixer
          sound="src: #labuaudio; autoplay: false; loop: false"
        ></a-entity>
      </a-marker>

      <!-- Marker Ceri -->
      <a-marker
        id="marker-ceri"
        class="fruit-marker"
        type="pattern"
        url="marker/Ceri.patt"
      >
        <a-entity
          id="ceri-entity"
          gltf-model="#ceri"
          position="0 0 0"
          rotation="30 180 0"
          scale="0.5 0.5 0.5"
          animation-mixer
          sound="src: #ceriaudio; autoplay: false; loop: false"
        ></a-entity>
      </a-marker>

      <!-- Marker Jeruk -->
      <a-marker
        id="marker-jeruk"
        class="fruit-marker"
        type="pattern"
        url="marker/Jeruk.patt"
      >
        <a-entity
          id="jeruk-entity"
          gltf-model="#jeruk"
          position="0 0 0"
          rotation="30 180 0"
          scale="20 20 20"
          animation-mixer
          sound="src: #jerukaudio; autoplay: false; loop: false"
        ></a-entity>
      </a-marker>

      <!-- Marker Nanas -->
      <a-marker
        id="marker-nanas"
        class="fruit-marker"
        type="pattern"
        url="marker/Nanas.patt"
      >
        <a-entity
          id="nanas-entity"
          gltf-model="#nanas"
          position="0 0 0"
          rotation="30 180 0"
          scale="0.5 0.5 0.5"
          animation-mixer
          sound="src: #nanasaudio; autoplay: false; loop: false"
        ></a-entity>
      </a-marker>

      <!-- Marker Tomat -->
      <a-marker
        id="marker-tomat"
        class="fruit-marker"
        type="pattern"
        url="marker/tomat2.patt"
      >
        <a-entity
          id="tomat-entity"
          gltf-model="#tomat"
          position="0 0 0"
          rotation="30 200 0"
          scale="15 15 15"
          animation-mixer
          sound="src: #tomataudio; autoplay: false; loop: false"
        ></a-entity>
      </a-marker>

       <!-- Marker Semangka -->
      <a-marker
        id="marker-semangka"
        class="fruit-marker"
        type="pattern"
        url="marker/Semangka.patt"
      >
        <a-entity
          id="semangka-entity"
          gltf-model="#semangka"
          position="0 0 0"
          rotation="30 180 0"
          scale="5 5 5"
          animation-mixer
          sound="src: #semangkaaudio; autoplay: false; loop: false"
        ></a-entity>
      </a-marker>
      
      <!-- Marker Anggur -->
      <a-marker
        id="marker-anggur"
        class="fruit-marker"
        type="pattern"
        url="marker/anggur2.patt"
      >
        <a-entity
          id="anggur-entity"
          gltf-model="#anggur"
          position="0 0 0"
          rotation="30 180 0"
          scale="0.0015 0.0015 0.0015"
          animation-mixer
          sound="src: #angguraudio; autoplay: false; loop: false"
        ></a-entity>
      </a-marker>

      <!-- Kamera -->
      <a-entity camera></a-entity>
    </a-scene>

    <!-- Audio Buah dan Button Mulai -->
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const btnMulai = document.getElementById("btn-mulai");
        const welcomeAudio = document.getElementById("welcome-audio");

        if (btnMulai && welcomeAudio) {
          btnMulai.addEventListener("click", function () {
            welcomeAudio.play();
            btnMulai.style.display = "none";
          });
        }

        const fruitMarkers = document.querySelectorAll(".fruit-marker");

        fruitMarkers.forEach((marker) => {
          marker.addEventListener("markerFound", () => {
            const entity = marker.querySelector("[sound]");
            if (entity && entity.components.sound) {
              welcomeAudio.pause();
              welcomeAudio.currentTime = 0;
              entity.components.sound.playSound();
            }
          });

          marker.addEventListener("markerLost", () => {
            const entity = marker.querySelector("[sound]");
            if (entity && entity.components.sound) {
              entity.components.sound.stopSound();
            }
          });
        });
      });
    </script>
  </body>
</html>
